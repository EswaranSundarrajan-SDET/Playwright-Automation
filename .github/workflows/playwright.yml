name: Playwright checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    # This Ubuntu version supports the browsers in package-lock.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Keep the remaining jobs running if one browser fails.
      fail-fast: false
      matrix:
        project: [api, chromium, firefox, webkit]
    name: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        if: matrix.project == 'api'
        run: npm run typecheck
      - name: Install the browser for this job
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run this group of tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Save the HTML report and any failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
